# Quando cambia opere.json (anche dal pannello), rigenera le pagine
# delle singole opere e la sitemap per i motori di ricerca.
name: Pagine delle opere

on:
  push:
    branches: [main]
    paths: ['opere.json', '.github/scripts/pagine.py']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  pagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow && python .github/scripts/versioni.py && python .github/scripts/pagine.py
      - name: Salva e ripubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A opere sitemap.xml immagini/web index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Pagine delle opere aggiornate"
          git pull --rebase -q origin main
          git push -q origin main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
